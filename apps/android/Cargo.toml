[package]
name = "physbox-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
solver-lab = ["physbox-engine/solver-lab", "physbox-launch/solver-lab"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "physbox_android"
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
log.workspace = true
physbox-engine = { path = "../../crates/physbox-engine" }
physbox-launch = { path = "../../crates/physbox-launch" }
physbox-shell = { path = "../../crates/physbox-shell" }
winit.workspace = true
