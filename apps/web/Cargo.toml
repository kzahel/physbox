[package]
name = "physbox-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["box2d-comparator"]
box2d-comparator = ["physbox-engine/box2d-comparator"]
solver-lab = ["physbox-engine/solver-lab", "physbox-launch/solver-lab"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook.workspace = true
form_urlencoded.workspace = true
js-sys.workspace = true
physbox-engine = { path = "../../crates/physbox-engine", default-features = false }
physbox-launch = { path = "../../crates/physbox-launch" }
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wgpu.workspace = true

[dependencies.web-sys]
workspace = true
features = ["History", "HtmlCanvasElement", "Performance", "Storage", "Window", "console"]
