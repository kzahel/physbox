name: Deploy PhysBox Web Showcase

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/showcase-pages.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/showcase-web/**"
      - "crates/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/build-showcase-web.mjs"
      - "scripts/check-showcase-pages-artifact.mjs"
      - "showcase-web/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.92.0

      - name: Cache Rust build inputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target/wasm-bindgen-cli-0.2.125
            target/wasm32-unknown-unknown
          key: ${{ runner.os }}-showcase-rust-1.92.0-bindgen-0.2.125-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-showcase-rust-1.92.0-bindgen-0.2.125-

      - name: Build release showcase
        run: node scripts/build-showcase-web.mjs --release --output dist-showcase

      - name: Validate static artifact
        run: node scripts/check-showcase-pages-artifact.mjs dist-showcase

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-showcase

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
