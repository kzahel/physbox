[package]
name = "physbox-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[dependencies]
flate2.workspace = true
physbox-contracts = { path = "../physbox-contracts" }
physbox-engine = { path = "../physbox-engine", default-features = false, features = ["solver-lab"] }
physbox-launch = { path = "../physbox-launch" }
png.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Keep Cargo's workspace graph bounded. Closed study commands remain under
# `src/bin` as source history, but only these maintained entry points are
# executable targets.
[[bin]]
name = "physbox-lab"
path = "src/main.rs"
test = false

[[bin]]
name = "physbox-oracle-fixture"
path = "src/bin/physbox-oracle-fixture.rs"
test = false

[[bin]]
name = "physbox-check"
path = "src/bin/physbox-check.rs"
test = false

