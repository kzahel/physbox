<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore PhysBox, a GPU-resident 2D physics engine built for portable WebGPU."
    />
    <title>PhysBox Web Showcase</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='5' width='22' height='22' rx='6' fill='%2344c9f2'/%3E%3Crect x='11' y='11' width='16' height='16' rx='4' fill='%2307101d'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="identity">
        <h1><a href="./">PhysBox web demo</a></h1>
        <span>GPU-resident 2D physics / WebGPU</span>
      </div>
      <form class="controls" aria-label="Demo controls" onsubmit="return false">
        <label for="scene-select">Scene:</label>
        <select id="scene-select">
          <option value="playground">Playground</option>
          <option value="stack-and-sleep">Stack and sleep</option>
          <option value="water-and-rigid" selected>Water and rigid bodies</option>
          <option value="rigid-stress-2k">Rigid stress 2K</option>
          <option value="rigid-stress-5k">Rigid stress 5K</option>
          <option value="rigid-stress-10k">Rigid stress 10K</option>
          <option value="rigid-stress-20k">Rigid stress 20K</option>
          <option value="rigid-stress-50k">Rigid stress 50K</option>
          <option value="water-stress">Water stress</option>
        </select>
        <fieldset class="tool-buttons" aria-label="Tool">
          <legend>Tool:</legend>
          <button
            id="tool-drag"
            class="tool-button"
            type="button"
            data-tool="drag"
            aria-label="Drag body"
            aria-pressed="true"
            title="Drag body"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 2v5M12 17v5M2 12h5M17 12h5"></path>
            </svg>
          </button>
          <button
            id="tool-box"
            class="tool-button"
            type="button"
            data-tool="box"
            aria-label="Place box"
            aria-pressed="false"
            title="Place box"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="5" width="14" height="14"></rect>
              <path d="M12 8v8M8 12h8"></path>
            </svg>
          </button>
          <button
            id="tool-water"
            class="tool-button"
            type="button"
            data-tool="water"
            aria-label="Add water"
            aria-pressed="false"
            title="Add water"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3C6 6 4.5 8.2 4.5 11a3.5 3.5 0 0 0 7 0C11.5 8.2 10 6 8 3Z"></path>
              <path d="M16.5 8c-1.7 2.5-3 4.4-3 6.8a3 3 0 0 0 6 0c0-2.4-1.3-4.3-3-6.8Z"></path>
            </svg>
          </button>
          <button
            id="tool-pan"
            class="tool-button"
            type="button"
            data-tool="pan"
            aria-label="Pan camera"
            aria-pressed="false"
            title="Pan camera; wheel or trackpad zooms"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"></path>
            </svg>
          </button>
        </fieldset>
        <label for="body-capacity-select">Max bodies:</label>
        <select id="body-capacity-select" class="capacity-select">
          <option value="64">64</option>
          <option value="256" selected>256</option>
          <option value="1000">1K</option>
          <option value="2000">2K</option>
          <option value="5000">5K</option>
          <option value="10000">10K</option>
          <option value="20000">20K</option>
          <option value="50000">50K</option>
        </select>
        <label for="water-capacity-select">Max water:</label>
        <select id="water-capacity-select" class="capacity-select">
          <option value="0">None</option>
          <option value="4096" selected>4K</option>
          <option value="8192">8K</option>
          <option value="16384">16K</option>
        </select>
        <label for="physics-select">Physics:</label>
        <select id="physics-select" class="rate-select">
          <option value="30">30 Hz</option>
          <option value="60" selected>60 Hz</option>
        </select>
        <button id="pause-button" type="button" aria-pressed="false">Pause</button>
        <button id="reset-button" type="button">Reset</button>
      </form>
      <span id="config-state" aria-live="polite"></span>
    </header>

    <main>
      <section class="stage" aria-labelledby="scene-heading">
        <div class="stage-copy">
          <p>
            <strong id="scene-heading">Water and rigid bodies</strong>
            <span aria-hidden="true"> — </span>
            <span id="scene-description">
              Preview water and rigid shapes exchange motion in one coupled GPU world.
            </span>
          </p>
          <p class="hint" id="scene-hint">Drag any moving body</p>
        </div>
        <div class="canvas-shell">
          <canvas
            id="showcase-canvas"
            width="1200"
            height="750"
            aria-label="Interactive PhysBox physics scene"
          ></canvas>
          <div class="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">Starting WebGPU…</span>
          </div>
          <p id="fatal-error" role="alert" hidden></p>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
