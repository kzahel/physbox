[workspace]
members = [
  "apps/android",
  "apps/desktop",
  "apps/headless",
  "apps/web",
  "crates/physbox-box2d-comparator",
  "crates/physbox-engine",
  "crates/physbox-contracts",
  "crates/physbox-lab",
  "crates/physbox-launch",
  "crates/physbox-shell",
  "crates/physbox-ui",
  "tools/oracles/box2d",
  "tools/oracles/particle-common",
  "tools/oracles/physbox3-particles",
  "tools/oracles/liquidfun",
  "tools/benchmarks/box2d",
  "tools/benchmarks/android-gpu",
]
default-members = [
  "apps/android",
  "apps/desktop",
  "apps/headless",
  "apps/web",
  "crates/physbox-box2d-comparator",
  "crates/physbox-engine",
  "crates/physbox-contracts",
  "crates/physbox-launch",
  "crates/physbox-shell",
  "crates/physbox-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.1.0"
publish = false

[workspace.dependencies]
bindgen = "0.72.1"
bytemuck = { version = "1", features = ["derive"] }
cc = "1"
console_error_panic_hook = "0.1"
form_urlencoded = "1"
flate2 = "1"
jni = "0.22"
js-sys = "0.3.102"
log = "0.4"
png = "0.18"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "=0.4.75"
web-sys = "0.3.102"
wgpu = { version = "25", features = ["metal", "vulkan", "vulkan-portability"] }
winit = { version = "0.30", features = ["android-native-activity"] }
